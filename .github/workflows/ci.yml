name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QUICK_E2E_CACHE: ${{ github.workspace }}/.e2e-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Deno runtime
        uses: actions/cache@v4
        with:
          path: .e2e-cache/runtime
          key: deno-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('catalogue/runtime.lock') }}

      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Check catalogue
        run: go run ./cmd/quick-catalogue check

      - name: Test
        run: go test ./...
